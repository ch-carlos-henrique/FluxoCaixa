name: CD

# Deploy automático ao push em main (descomentar quando repositório e secrets estiverem configurados):
# on:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_OPERATIONS: ${{ secrets.DOCKER_USERNAME }}/fluxocaixa-operations-api
  IMAGE_CONSOLIDATION: ${{ secrets.DOCKER_USERNAME }}/fluxocaixa-consolidation-api

jobs:
  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Login no Docker Hub (requer secrets DOCKER_USERNAME e DOCKER_TOKEN no repositório)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Tag curta do commit (primeiros 8 caracteres do SHA)
      - name: Set image tag
        id: tag
        run: echo "TAG=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build & push Operations API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/FluxoCaixa.Operations.API/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_OPERATIONS }}:${{ steps.tag.outputs.TAG }}
            ${{ env.IMAGE_OPERATIONS }}:latest

      - name: Build & push Consolidation API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/FluxoCaixa.Consolidation.API/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_CONSOLIDATION }}:${{ steps.tag.outputs.TAG }}
            ${{ env.IMAGE_CONSOLIDATION }}:latest
