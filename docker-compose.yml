version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fluxocaixa-postgres
    environment:
      POSTGRES_USER: fluxocaixa
      POSTGRES_PASSWORD: fluxocaixa_dev
      POSTGRES_DB: fluxocaixa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxocaixa"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fluxocaixa-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  operations-api:
    build:
      context: .
      dockerfile: src/FluxoCaixa.Operations.API/Dockerfile
    container_name: fluxocaixa-operations-api
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Operations: "Host=postgres;Port=5432;Database=fluxocaixa_operations;Username=fluxocaixa;Password=fluxocaixa_dev"
      RabbitMQ__Host: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  consolidation-api:
    build:
      context: .
      dockerfile: src/FluxoCaixa.Consolidation.API/Dockerfile
    container_name: fluxocaixa-consolidation-api
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Consolidation: "Host=postgres;Port=5432;Database=fluxocaixa_consolidation;Username=fluxocaixa;Password=fluxocaixa_dev"
      RabbitMQ__Host: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
  rabbitmq_data:
